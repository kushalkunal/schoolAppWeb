spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

  # Gmail SMTP for dev testing — set EMAIL_PROVIDER=SMTP and SMTP_PASSWORD=<app-password>
  # to send real emails. Leave unset to stay on LOGGING mode (emails printed to stdout).
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:thekkdotin@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

app:
  email:
    # All outbound emails are redirected to this address in dev so test notifications land
    # in one inbox. Clear (or set to empty) to deliver to actual parent emails.
    dev-recipient-override: ${EMAIL_DEV_OVERRIDE:thekkdotin@gmail.com}

logging:
  level:
    in.schoolapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
