services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolapp-postgres
    environment:
      POSTGRES_DB: schoolapp
      POSTGRES_USER: schoolapp
      POSTGRES_PASSWORD: schoolapp_dev_password
    ports:
      # Mapped to 55432 on the host to avoid clashing with other postgres instances on 5432.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolapp -d schoolapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schoolapp-redis
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
