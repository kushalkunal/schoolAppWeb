server:
  # OCR runs on a different port so it can sit beside the main backend in dev compose.
  port: ${OCR_SERVICE_PORT:8090}

spring:
  application:
    name: schoolapp-ocr-service

app:
  ocr:
    # LOGGING (default) → canned receipt text. GOOGLE_CLOUD_VISION → real OCR.
    provider: ${OCR_PROVIDER:LOGGING}
    google-cloud-vision:
      api-key: ${GOOGLE_VISION_API_KEY:}
      feature-type: ${GOOGLE_VISION_FEATURE:DOCUMENT_TEXT_DETECTION}

  llm:
    # LOGGING (default) → canned mock records. Real: OPENAI | ANTHROPIC | GEMINI.
    provider: ${LLM_PROVIDER:LOGGING}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info
